name: global_fx_tracker
description: "全球匯率通 (Global FX Tracker) - Real-time multi-currency exchange rates, interactive 1D-10Y & 3-FX overlay charts, JPG export, and 10-currency converter table."
publish_to: "none"
version: 1.2.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  share_plus: ^10.1.3
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/rates_2016_2026.json
